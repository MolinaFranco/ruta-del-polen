  <title id="titulo">Canario rojo (Dicliptera squarrosa), en tierra</title>
  <desc>Herbácea de flores rojas, finas y tubulares. Doble función: sus hojas crían a las orugas de la Bataraza y sus flores son de las preferidas de los colibríes.</desc>
