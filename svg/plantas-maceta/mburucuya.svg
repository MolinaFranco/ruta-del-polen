  <title id="titulo">Mburucuyá (Passiflora caerulea), en maceta</title>
  <desc>La trepadora nativa más generosa: da sombra, flores espectaculares y frutos para las aves. Es la planta nutricia del Espejito y de otras mariposas anaranjadas.</desc>
