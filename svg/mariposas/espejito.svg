<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Espejito (Agraulis vanillae)</title>
  <desc>Alas alargadas de color naranja vivo con marcas negras y tres puntitos blancos rodeados de negro en el ala delantera. El reverso es castaño, con grandes manchas plateadas: de ahí su nombre.</desc>
