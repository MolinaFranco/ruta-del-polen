<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Bataraza (Ortilia ithra)</title>
  <desc>Pardo oscura con manchas blancas y cremas en el ala delantera y una banda clara que cruza el ala trasera, con pequeñas medialunas anaranjadas cerca del borde.</desc>
