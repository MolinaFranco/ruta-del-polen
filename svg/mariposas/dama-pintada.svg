<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Dama pintada (Vanessa braziliensis)</title>
  <desc>Naranja rosado con la punta del ala delantera negra y manchas blancas. Se la reconoce por los dos ocelos grandes y azulados del ala trasera. Es la versión sudamericana de la famosa dama pintada (Vanessa cardui), que no vive en nuestra región.</desc>
