<!-- La ruta del polen. Ilustración del proyecto de Brezzo, Ledesma, Morales y Quiroz (Ética, Universidad Blas Pascal). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Limonera grande (Heraclides thoas)</title>
  <desc>Alas negras cruzadas en diagonal por una ancha banda de manchas amarillas, que va de cerca de la punta del ala delantera hasta el centro del ala trasera. Cerca del borde tiene una hilera de medialunas amarillas, y las alas traseras terminan en dos colas en forma de cuchara con el centro amarillo. Por debajo es casi toda amarilla.</desc>
