<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Monarca del sur (Danaus erippus)</title>
  <desc>Naranja intenso con venas negras bien marcadas y borde negro salpicado de puntos blancos. Se separó de la monarca del norte hace unos dos millones de años; se distingue porque el borde inferior del ala delantera es naranja y no negro.</desc>
