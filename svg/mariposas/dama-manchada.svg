  <title id="titulo">Dama manchada (Vanessa carye)</title>
  <desc>Muy parecida a la Dama pintada, pero con una hilera de cuatro ocelos chicos de centro azul en el ala trasera, y la barra de la punta del ala delantera anaranjada en vez de blanca.</desc>
