<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Hortensia (Euptoieta hortensia)</title>
  <desc>Naranja leonado con un dibujo fino de líneas en zigzag y una hilera de puntos negros cerca del borde. El reverso es castaño jaspeado, sin manchas plateadas: así se la distingue del Espejito.</desc>
