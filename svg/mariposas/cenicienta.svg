  <title id="titulo">Cenicienta (Anartia jatrophae)</title>
  <desc>Alas blanco nacarado cruzadas por finas líneas pardas, con el borde anaranjado y festoneado. Tiene un ocelo negro en cada ala delantera y dos en cada ala trasera, que despistan a los pájaros.</desc>
