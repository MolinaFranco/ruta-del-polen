<!-- La ruta del polen. Ilustración del proyecto de Brezzo, Ledesma, Morales y Quiroz (Ética, Universidad Blas Pascal). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-118 -88 236 172" width="472" height="344" role="img" aria-labelledby="titulo">
  <title id="titulo">Bordes de oro (Battus polydamas)</title>
  <desc>Alas negras con reflejos verdosos y una banda de manchas amarillas cerca del borde. No tiene "colitas" como otras de su familia. Por debajo, las alas traseras llevan una hilera de medialunas rojas.</desc>
